name: Validate NH1 live microphone overlay

on:
  push:
    branches:
      - nh1-mic-ci-20260822
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    name: DT overlay and module compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential device-tree-compiler flex \
            gcc-aarch64-linux-gnu git libelf-dev libssl-dev python3 rsync

      - name: Clone and patch Spacewar kernel
        run: |
          git clone --depth=1 --branch fekz115/spacewar-6.19 \
            https://github.com/mainlining/linux.git linux
          git -C linux config user.name "NH1 CI"
          git -C linux config user.email "nh1-ci@example.invalid"
          git -C linux am "$GITHUB_WORKSPACE"/patches/linux/*.patch

      - name: Build final Spacewar DTB and prepare module tree
        working-directory: linux
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make defconfig
          make -j"$(nproc)" modules_prepare
          make -j"$(nproc)" qcom/sm7325-nothing-spacewar.dtb

      - name: Compile and apply live overlay
        run: |
          linux/scripts/dtc/dtc -@ -q -I dts -O dtb \
            -o live-overlay/nh1-mic-overlay.dtbo \
            live-overlay/nh1-mic-overlay.dts
          linux/scripts/dtc/fdtoverlay \
            -i linux/arch/arm64/boot/dts/qcom/sm7325-nothing-spacewar.dtb \
            -o live-overlay/merged-spacewar.dtb \
            live-overlay/nh1-mic-overlay.dtbo
          test "$(fdtget -t s \
            live-overlay/merged-spacewar.dtb \
            /soc@0/soundwire@3210000/haptics@0,0 compatible)" \
            = "sdw20217f00100"
          fdtget -t s \
            live-overlay/merged-spacewar.dtb /sound audio-routing \
            | grep -q 'TX SWR_INPUT8.*DMIC5_OUTPUT'
          fdtget -t s \
            live-overlay/merged-spacewar.dtb /sound audio-routing \
            | grep -q 'TX SWR_INPUT10.*DMIC7_OUTPUT'
          fdtget -t s \
            live-overlay/merged-spacewar.dtb /sound audio-routing \
            | grep -q 'TX SWR_INPUT11.*DMIC8_OUTPUT'

      - name: Generate embedded overlay header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('live-overlay/nh1-mic-overlay.dtbo').read_bytes()
          lines = [
              '/* Generated by CI. */',
              'static const unsigned char nh1_mic_overlay_dtbo[] = {',
          ]
          for offset in range(0, len(source), 12):
              chunk = source[offset:offset + 12]
              lines.append('\t' + ', '.join(f'0x{value:02x}' for value in chunk) + ',')
          lines.extend([
              '};',
              'static const unsigned int nh1_mic_overlay_dtbo_len =',
              '\tsizeof(nh1_mic_overlay_dtbo);',
              '',
          ])
          Path('live-overlay/nh1_mic_overlay_blob.h').write_text('\n'.join(lines))
          PY

      - name: Compile module source for arm64
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make -C linux M="$GITHUB_WORKSPACE/live-overlay" \
            nh1_mic_overlay.o
          linux/scripts/checkpatch.pl --strict --file \
            live-overlay/nh1_mic_overlay.c

      - name: Upload overlay build products
        uses: actions/upload-artifact@v4
        with:
          name: nh1-live-microphone-overlay
          path: |
            live-overlay/nh1-mic-overlay.dtbo
            live-overlay/nh1_mic_overlay.o
            live-overlay/merged-spacewar.dtb
          if-no-files-found: error
